services:
  elyfn:
    build: .
    container_name: elyfn
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ELYFN_HOST=0.0.0.0
      - ELYFN_PORT=3000
      - ELYFN_BASE_DIR=/app/functions
    ports:
      # 默认仅监听本机，配合 Nginx/Caddy 反向代理；如需直连可改为 "3000:3000"
      - "${ELYFN_BIND_ADDR:-127.0.0.1:${ELYFN_PORT:-3000}}:3000"
    volumes:
      # 默认使用命名卷，Docker 会自动继承镜像内 node(UID 1000) 权限，避免宿主机挂载 EACCES 冲突
      # 如需改为宿主机目录挂载，请执行 `mkdir -p functions && chown 1000:1000 functions` 后替换为 ./functions:/app/functions
      - elyfn_functions:/app/functions
    # 容器安全与资源隔离
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 10s

volumes:
  elyfn_functions:
