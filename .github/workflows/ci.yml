name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check all JS files
        run: |
          for f in *.js handlers/*.js utils/*.js tests/*.js; do
            node --check "$f"
          done

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Run unit & end-to-end tests
        run: npm test

  docker-smoke:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t elyfn:ci .

      - name: Run container smoke test
        run: |
          set -uo pipefail
          docker run -d --name elyfn-ci \
            -p 127.0.0.1:3000:3000 \
            -e ELYFN_ADMIN_KEY=ci-admin-key \
            elyfn:ci
          trap 'docker rm -f elyfn-ci >/dev/null 2>&1 || true' EXIT

          # 断言统一用「先取 body 再 bash 模式匹配」，不用 `curl | grep -q`：
          # pipefail 下 grep 提前退出会让 curl 收到 SIGPIPE，整条管线被误判为失败。
          expect() {
            local label=$1 pat=$2 body=$3
            if [[ $body != *"$pat"* ]]; then
              echo "::error::$label: expected pattern $pat"
              echo "--- body ---"
              echo "$body" | head -c 800
              exit 1
            fi
            echo "✓ $label"
          }

          ready=0
          for i in $(seq 1 40); do
            body=$(curl -sS http://127.0.0.1:3000/ 2>/dev/null) || body=""
            if [[ $body == *elyfn* ]]; then
              ready=1
              echo "✓ server answered after ${i}s"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' elyfn-ci 2>/dev/null)" != "true" ]; then
              echo "::error::container exited before becoming ready"
              docker logs elyfn-ci || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::server did not answer within 40s"
            docker logs elyfn-ci || true
            exit 1
          fi

          expect "catalog empty" '"success":true' "$(curl -sS http://127.0.0.1:3000/catalog)"

          expect "upload square.js" '"success":true' "$(curl -sS -X PUT \
            -H "Authorization: Bearer ci-admin-key" \
            -F "file=@examples/square.js;filename=square.js" \
            http://127.0.0.1:3000/ci/square.js)"

          expect "catalog lists square" '"square"' "$(curl -sS http://127.0.0.1:3000/catalog)"

          expect "execute square(6) = 36" '"square":36' "$(curl -sS -X POST \
            -H "Content-Type: application/json" -d '{"x":6}' \
            http://127.0.0.1:3000/ci/square)"

          expect "delete square.js" '"success":true' "$(curl -sS -X DELETE \
            -H "Authorization: Bearer ci-admin-key" \
            http://127.0.0.1:3000/manage/ci/square)"
